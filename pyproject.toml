[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-manifold-atlas"
version = "0.6.0"
description = "Semantic ABI: evidence-gated semantic compatibility and AI change-control plane"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
authors = [{name = "TFourniax"}]

[project.scripts]
semantic-abi = "semantic_atlas.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = ["scikit-learn>=1.4", "scikit-image>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"