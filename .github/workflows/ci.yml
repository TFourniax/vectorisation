name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: python benchmarks/hubness_benchmark.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel outside source checkout
        run: |
          python -m venv /tmp/semantic-abi-wheel
          /tmp/semantic-abi-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/semantic-abi-wheel/bin/python -c "import semantic_atlas; print(semantic_atlas.__file__)"
          /tmp/semantic-abi-wheel/bin/semantic-abi --help

  evidence-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify promoted evidence still matches source blobs
        run: python tools/check_evidence_freshness.py
