name: semantic-repair-incidence

on:
  workflow_dispatch:
  push:
    branches: [agent/semantic-manifold-atlas]
    paths:
      - benchmarks/semantic_repair_incidence_scifact_benchmark.py
      - src/semantic_atlas/repair_incidence.py
      - .github/workflows/semantic-repair-incidence.yml

jobs:
  incidence-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: scifact-encoders-minilm-bge-v1
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]' sentence-transformers datasets
      - name: Compare clause-incidence repair with existing planners
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python benchmarks/semantic_repair_incidence_scifact_benchmark.py
          --train-queries 350
          --test-queries 200
          --max-docs 1800
          --integrity-anchors 250
          --corruption-fraction 0.10
          --budgets 10,25,50,100,180
          --seed 619
          --output artifacts/scifact_repair_incidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-repair-incidence-evidence
          path: artifacts/scifact_repair_incidence.json
          if-no-files-found: error
