name: late-interaction-semantic-abi

on:
  workflow_dispatch:
  push:
    branches:
      - agent/semantic-manifold-atlas
    paths:
      - "src/semantic_atlas/protocol_v1.py"
      - "src/semantic_atlas/late_interaction.py"
      - "src/semantic_atlas/conformance.py"
      - "src/semantic_atlas/remote_v1.py"
      - "benchmarks/semantic_abi_late_interaction_scifact.py"
      - ".github/workflows/late-interaction-semantic-abi.yml"

jobs:
  colbert-protocol-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semantic-abi-colbertv2-scifact-v1
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]' datasets pylate==1.5.0
      - name: Run real ColBERTv2 late-interaction portability gate
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python benchmarks/semantic_abi_late_interaction_scifact.py
          --model lightonai/colbertv2.0
          --train-queries 300
          --test-queries 200
          --max-docs 1800
          --batch-size 16
          --seed 827
          --output artifacts/scifact_late_interaction_protocol_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-abi-late-interaction-scifact-v1
          path: artifacts/scifact_late_interaction_protocol_v1.json
          if-no-files-found: error
