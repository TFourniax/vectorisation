name: real-data-mechanisms

on:
  workflow_dispatch:
  push:
    branches:
      - agent/semantic-manifold-atlas
    paths:
      - benchmarks/digits_coordinate_benchmark.py
      - benchmarks/semantic_abi_digits_benchmark.py
      - benchmarks/semantic_diff_digits_benchmark.py
      - benchmarks/semantic_mutation_digits_benchmark.py
      - benchmarks/semantic_witness_digits_benchmark.py
      - benchmarks/semantic_diagnostic_digits_benchmark.py
      - benchmarks/semantic_progressive_audit_digits_benchmark.py
      - src/semantic_atlas/witness.py
      - src/semantic_atlas/diagnostic.py
      - src/semantic_atlas/progressive_audit.py
      - src/semantic_atlas/oracle.py
      - src/semantic_atlas/risk_exact.py
      - src/semantic_atlas/mutation.py
      - src/semantic_atlas/contracts.py
      - .github/workflows/real-data-mechanisms.yml

jobs:
  digits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[bench]'
      - name: Coordinate transition benchmark
        run: python benchmarks/digits_coordinate_benchmark.py | tee digits-coordinate.json
      - name: Semantic ABI corruption/repair benchmark
        run: python benchmarks/semantic_abi_digits_benchmark.py | tee digits-abi.json
      - name: Semantic Diff active contract discovery benchmark
        run: python benchmarks/semantic_diff_digits_benchmark.py | tee digits-semantic-diff.json
      - name: Semantic ABI mutation adequacy benchmark
        run: python benchmarks/semantic_mutation_digits_benchmark.py | tee digits-semantic-mutation.json
      - name: Semantic Witness held-out contract compression benchmark
        run: python benchmarks/semantic_witness_digits_benchmark.py | tee digits-semantic-witness.json
      - name: Semantic Diagnostic Panel held-out benchmark
        run: python benchmarks/semantic_diagnostic_digits_benchmark.py | tee digits-semantic-diagnostic.json
      - name: Progressive Semantic Audit cost benchmark
        run: python benchmarks/semantic_progressive_audit_digits_benchmark.py | tee digits-progressive-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-mechanism-evidence
          path: |
            digits-coordinate.json
            digits-abi.json
            digits-semantic-diff.json
            digits-semantic-mutation.json
            digits-semantic-witness.json
            digits-semantic-diagnostic.json
            digits-progressive-audit.json
          if-no-files-found: error
