name: real-encoder-benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - agent/semantic-manifold-atlas
    paths:
      - benchmarks/real_encoder_scifact_benchmark.py
      - benchmarks/real_encoder_risk_calibration_benchmark.py
      - benchmarks/semantic_abi_sparse_scifact_benchmark.py
      - benchmarks/evidence_gated_transition_npz.py
      - src/semantic_atlas/oracle.py
      - src/semantic_atlas/risk_control.py
      - src/semantic_atlas/risk_exact.py
      - src/semantic_atlas/support.py
      - src/semantic_atlas/contracts.py
      - .github/workflows/real-encoder.yml

jobs:
  scifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache public embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: scifact-encoders-minilm-bge-v1
      - run: python -m pip install --upgrade pip
      - name: Install benchmark dependencies
        run: pip install -e '.[dev]' sentence-transformers datasets
      - name: Run real neural-encoder SciFact benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python benchmarks/real_encoder_scifact_benchmark.py
          --train-queries 500
          --test-queries 200
          --max-docs 1800
          --anchor-fraction 0.20
          --target-risk 0.10
          --delta 0.10
          --output artifacts/real_encoder_report.json
          --npz artifacts/scifact_pair.npz
      - name: Audit same Semantic ABI over sparse BM25
        run: >-
          python benchmarks/semantic_abi_sparse_scifact_benchmark.py
          --dense-report artifacts/real_encoder_report.json
          --train-queries 500
          --test-queries 200
          --max-docs 1800
          --output artifacts/sparse_portability_report.json
      - name: Compare semantic risk certification policies
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python benchmarks/real_encoder_risk_calibration_benchmark.py
          --train-queries 500
          --test-queries 200
          --max-docs 1800
          --delta 0.10
          --selection-risk-fraction 0.75
          --output artifacts/risk_calibration_comparison.json
      - name: Validate global-vs-local complexity selection
        run: >-
          python benchmarks/evidence_gated_transition_npz.py
          artifacts/scifact_pair.npz
          --anchor-fraction 0.20
          --k 10
          --output artifacts/evidence_gated_transition.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-encoder-scifact
          path: artifacts/
          if-no-files-found: error
