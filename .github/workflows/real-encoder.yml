name: real-encoder-benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - agent/semantic-manifold-atlas
    paths:
      - benchmarks/real_encoder_scifact_benchmark.py
      - .github/workflows/real-encoder.yml

jobs:
  scifact:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache public embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: scifact-encoders-minilm-bge-v1
      - run: python -m pip install --upgrade pip
      - name: Install benchmark dependencies
        run: pip install -e '.[dev]' sentence-transformers datasets
      - name: Run real neural-encoder SciFact benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python benchmarks/real_encoder_scifact_benchmark.py
          --train-queries 500
          --test-queries 200
          --max-docs 1800
          --anchor-fraction 0.20
          --target-risk 0.10
          --delta 0.10
          --output artifacts/real_encoder_report.json
          --npz artifacts/scifact_pair.npz
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-encoder-scifact
          path: artifacts/
          if-no-files-found: error
