name: product-integration

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: product-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qdrant-live:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Audit a real ephemeral Qdrant collection
        run: python integration/qdrant_live.py
