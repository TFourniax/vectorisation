name: progressive-audit-scale

on:
  workflow_dispatch:
  push:
    branches: [agent/semantic-manifold-atlas]
    paths:
      - benchmarks/semantic_progressive_audit_scale_benchmark.py
      - src/semantic_atlas/progressive_audit.py
      - src/semantic_atlas/oracle.py
      - src/semantic_atlas/risk_exact.py
      - .github/workflows/progressive-audit-scale.yml

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run 10k/100k/250k clause scaling benchmark
        run: python benchmarks/semantic_progressive_audit_scale_benchmark.py --sizes 10000,100000,250000 --batch-size 100 --max-draws 4000 --seed 811 --output artifacts/progressive_audit_scale.json
      - uses: actions/upload-artifact@v4
        with:
          name: progressive-audit-scale-evidence
          path: artifacts/progressive_audit_scale.json
          if-no-files-found: error
