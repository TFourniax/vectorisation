name: semantic-repair-neural

on:
  workflow_dispatch:
  push:
    branches: [agent/semantic-manifold-atlas]
    paths:
      - benchmarks/semantic_repair_scifact_benchmark.py
      - benchmarks/semantic_abi_multidataset_benchmark.py
      - src/semantic_atlas/repair.py
      - src/semantic_atlas/oracle.py
      - src/semantic_atlas/contracts.py
      - .github/workflows/semantic-repair-neural.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore public BGE model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: scifact-encoders-minilm-bge-v1
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]' sentence-transformers datasets huggingface-hub
      - name: Run controlled neural re-embedding economics benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python benchmarks/semantic_repair_scifact_benchmark.py
          --train-queries 350
          --test-queries 200
          --max-docs 1800
          --corruption-fractions 0.05,0.10
          --budgets 10,25,50,100,180
          --random-repeats 12
          --seed 619
          --output artifacts/scifact_repair_economics.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-repair-neural-evidence
          path: artifacts/scifact_repair_economics.json
          if-no-files-found: error
