name: multidataset-semantic-abi-parallel

on:
  workflow_dispatch:
  push:
    branches: [agent/semantic-manifold-atlas]
    paths:
      - benchmarks/semantic_abi_multidataset_benchmark.py
      - .github/workflows/multidataset-semantic-abi-parallel.yml

jobs:
  dataset:
    strategy:
      fail-fast: false
      matrix:
        dataset: [scifact, nfcorpus, fiqa]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semantic-abi-multidataset-minilm-bge-v1
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]' sentence-transformers datasets huggingface-hub
      - name: Run ${{ matrix.dataset }} falsification benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python benchmarks/semantic_abi_multidataset_benchmark.py
          --datasets ${{ matrix.dataset }}
          --train-queries 140
          --test-queries 100
          --max-docs 5000
          --seed 271
          --output artifacts/${{ matrix.dataset }}_semantic_abi.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-abi-${{ matrix.dataset }}
          path: artifacts/${{ matrix.dataset }}_semantic_abi.json
          if-no-files-found: error
